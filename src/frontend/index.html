<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageSpeed Insights Report</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"
    }
  }
  </script>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <div>
        <h1>PageSpeed Insights Report</h1>
        <p>Enter a webpage URL to generate a performance report.</p>
      </div>
      <div id="auth-controls" class="auth-controls">
        <button type="button" id="top-auth-btn" class="btn-primary auth-btn">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#ffffff" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#ffffff" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#ffffff" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#ffffff" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Login with Google
        </button>
        <div id="top-auth-status-container" class="hidden auth-status-wrap">
          <span id="top-auth-status" class="status-good">✓ GTM Connected</span>
          <button type="button" id="logout-btn" class="btn-logout">Logout</button>
        </div>
      </div>
    </header>

    <main>
      <form id="analyze-form">
        <div class="card mb-4">
          <h2 class="section-heading">Website Input</h2>
          <div class="input-group">
            <input type="url" id="url-input" placeholder="https://example.com" required>
            <select id="strategy-input" class="strategy-select">
              <option value="mobile" selected>Mobile</option>
              <option value="desktop">Desktop</option>
              <option value="both">Both</option>
            </select>
          </div>
        </div>

        <div id="gtm-configuration-section" class="card mb-4">
          <div class="card-header-flex">
            <h2 class="section-heading mb-0">GTM Configuration</h2>
            <span class="subtext">Paste GTM URL or select below</span>
          </div>
          <p id="gtm-auth-message" class="subtext mb-3">Login with Google is required to configure GTM.</p>
          
          <div class="gtm-url-card">
            <label for="gtm-url-input" class="form-label-bold">Paste GTM Tag Manager URL:</label>
            <div class="flex-row gap-2">
              <div class="flex-1 relative-input">
                <input type="text" id="gtm-url-input" placeholder="https://tagmanager.google.com/#/container/accounts/6005185171/containers/53757711/workspaces/191" class="form-control">
                <button type="button" id="gtm-url-clear-btn" class="hidden clear-input-btn" title="Clear GTM URL">&times;</button>
              </div>
              <button type="button" id="gtm-url-apply-btn" class="btn-primary btn-apply">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-6 4l3 3m5-7l-3 3m-3 3l-8 8a2.828 2.828 0 1 1-4-4l8-8m2-2l3 3"/></svg>
                Fetch & Configure
              </button>
            </div>
            <div id="gtm-url-feedback" class="hidden feedback-box"></div>
          </div>

          <div class="divider-text"><span>Or Select Manually</span></div>

          <div class="gtm-controls grid-3">
            <div>
              <label for="gtm-account-container" class="form-label">GTM Account</label>
              <div id="gtm-account-container" class="searchable-select-wrapper"></div>
            </div>
            <div>
              <label for="gtm-container-container" class="form-label">GTM Container</label>
              <div id="gtm-container-container" class="searchable-select-wrapper"></div>
            </div>
            <div>
              <label for="gtm-workspace-container" class="form-label">GTM Workspace</label>
              <div id="gtm-workspace-container" class="searchable-select-wrapper"></div>
            </div>
          </div>
        </div>
        
        <button type="submit" id="submit-btn" disabled class="btn-submit">Generate Report</button>
        <div id="error-message" class="error hidden mt-3"></div>
      </form>

      <div id="loading" class="hidden">
        <div class="spinner"></div>
        <p>Generating PageSpeed report...</p>
      </div>

      <div id="analyzed-url-container" class="hidden">
        <div class="analyzed-url"><strong>Analyzed URL:</strong> <span id="res-url"></span></div>
      </div>

      <div id="results" class="results-wrapper hidden"></div>

      <template id="result-template">
        <div class="result-section">
          <h2 class="strategy-title"></h2>
          <div class="error-message error hidden"></div>

          <div class="final-result-section hidden card projection-card">
            <div class="projection-header">
              <h3 class="projection-title">sGTM Performance Projection</h3>
              <div class="confidence-badge-container flex-center gap-2"></div>
            </div>

            <div class="pagespeed-score-box">
              <div class="pagespeed-score-estimation"></div>
            </div>

            <h4 class="table-section-title"><span>GTM Container Tag Classification</span><span class="sub-badge">3-Tier Model + Obsolete</span></h4>
            <div class="table-box">
              <table class="report-table">
                <thead><tr><th>Classification Tier</th><th>Impact / Action</th><th class="text-right">Tags</th></tr></thead>
                <tbody class="migration-opportunity-body"></tbody>
              </table>
            </div>

            <h4 class="table-section-title">Attributed Browser Workload Reduction</h4>
            <div class="table-box">
              <table class="report-table">
                <thead><tr><th>Workload Metric</th><th class="text-right">Current</th><th class="text-right">Estimated After Migration</th><th class="text-right">Potential Reduction</th></tr></thead>
                <tbody class="gtm-workload-body"></tbody>
              </table>
            </div>

            <div class="lab-metrics-container mb-3">
              <h4 class="table-section-title"><span>Lighthouse Lab Performance Metrics</span><span class="sub-badge">Drives Lighthouse Score</span></h4>
              <div class="table-box">
                <table class="report-table">
                  <thead><tr><th>Metric</th><th class="text-right">Current (Lab)</th><th class="text-right">Estimated (Likely)</th><th class="text-right">Projection Range</th><th class="text-right">Improvement</th></tr></thead>
                  <tbody class="lab-metrics-body"></tbody>
                </table>
              </div>
            </div>

            <div class="cwv-section-container mb-3">
              <h4 class="table-section-title"><span>Core Web Vitals (LCP, INP, CLS)</span><span class="sub-badge">Google Ranking Metrics</span></h4>
              <div class="table-box">
                <table class="report-table">
                  <thead><tr><th>Core Web Vital</th><th class="text-right">Current</th><th class="text-right">Estimated (Likely)</th><th class="text-right">Projection Range</th><th class="text-right">Improvement</th></tr></thead>
                  <tbody class="cwv-score-estimation"></tbody>
                </table>
              </div>
            </div>

            <div class="variance-notice-container notice-box"></div>
          </div>
        </div>
      </template>
    </main>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
